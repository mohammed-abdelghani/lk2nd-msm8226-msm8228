name: Build lk2nd
on:
  workflow_call:
    inputs:
      project:
        type: string
        required: true
      platform:
        type: string
        required: true
      options:
        type: string
      artifacts:
        type: string
        required: true

jobs:
  build:
    name: ${{ inputs.platform }}
    runs-on: ubuntu-latest
    steps:
      # lk2nd needs the dtc binary (device trees) and libfdt, which
      # lk2nd/scripts/dtbTool loads at runtime through ctypes. Build both from
      # source on GitHub instead of `apt-get install device-tree-compiler`:
      # Ubuntu mirrors live on Canonical infrastructure, and the Canonical
      # outage of 2026-11-11 (actions/runner-images#15296) took down every
      # apt-based job for hours. flex, bison, make and gcc ship with the
      # runner image.
      - name: Build dtc and libfdt from source (no apt)
        run: |
          # flex/bison ship with the runner image. If a future image drops
          # them, fall back to apt instead of dying on an obscure make error -
          # this is the only remaining apt dependency, and only as a last
          # resort, so a Canonical outage still cannot break the normal path.
          if ! command -v flex >/dev/null 2>&1 || ! command -v bison >/dev/null 2>&1; then
            echo "::warning::flex/bison missing from the runner image, installing with apt"
            sudo apt-get update -qq
            sudo apt-get install -yqq flex bison
          fi
          git clone --depth 1 --branch v1.8.1 https://github.com/dgibson/dtc.git "$RUNNER_TEMP/dtc-src"
          make -C "$RUNNER_TEMP/dtc-src" -j"$(nproc)" PREFIX="$HOME/.local" install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/.local/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          "$HOME/.local/bin/dtc" --version
          ls -l "$HOME/.local/lib"/libfdt.so*
        if: inputs.project == 'lk2nd'
      - name: Install cross compiler
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          # HACK: Force a specific version since compiler hash is unstable upstream.
          release: '15.3.Rel1'
      - run: arm-none-eabi-gcc --version
      - uses: actions/checkout@v7
      - name: Build
        run: git clean -dxf && make -j$(nproc) TOOLCHAIN_PREFIX=arm-none-eabi-
             ${{ inputs.options }} ${{ inputs.project }}-${{ inputs.platform }}
      - name: Check image size
        run: |
          IMAGE_FILE="build-${{ inputs.project }}-${{ inputs.platform }}/lk2nd.img"
          IMAGE_SIZE="$(stat -c%s "$IMAGE_FILE")"
          echo "Checking $IMAGE_FILE with size=$(( IMAGE_SIZE / 1024 ))KiB"
          if (( IMAGE_SIZE > 512 * 1024 )); then
            echo "::warning::The lk2nd.img file is too big!"
            exit 1
          fi
        shell: bash
        if: inputs.project == 'lk2nd'
      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.project }}-${{ inputs.platform }}
          path: ${{ inputs.artifacts }}
    env:
      LKLE_CFLAGS: -Werror
