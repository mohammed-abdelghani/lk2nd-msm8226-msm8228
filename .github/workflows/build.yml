name: Build
# Tag pushes are handled by release.yml, so they are excluded here to avoid
# building every release twice.
on:
  push:
    tags-ignore:
      - '**'
  pull_request:

jobs:
  lk2nd:
    uses: ./.github/workflows/lk2nd-matrix.yml
    with:
      project: lk2nd
      artifacts: |
        build-*/lk.bin
        build-*/lk2nd.img

  stock:
    uses: ./.github/workflows/stock-matrix.yml
