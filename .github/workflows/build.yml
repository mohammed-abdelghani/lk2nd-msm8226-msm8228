name: Build
# Note: defining only tags-ignore would also stop branch pushes (see the
# on.push filter rules), so branches are listed explicitly. Tag pushes are
# handled by release.yml instead, to avoid building every release twice.
on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  lk2nd:
    uses: ./.github/workflows/lk2nd-matrix.yml
    with:
      project: lk2nd
      artifacts: |
        build-*/lk.bin
        build-*/lk2nd.img

  stock:
    uses: ./.github/workflows/stock-matrix.yml
